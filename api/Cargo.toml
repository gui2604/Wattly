[package]
name = "wattly-api"
version = "0.1.0"
edition = "2021"
description = "API de credenciamento de anfitriões, usuários e pontos de recarga da Wattly"
publish = false
license = "MIT"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
argon2 = "0.5"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
jsonwebtoken = "9"
oracle = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
actix-http = "3"
